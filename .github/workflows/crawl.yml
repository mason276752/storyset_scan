name: crawl

on:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Max pages to crawl (0 = unlimited)'
        required: false
        default: '0'
      limit:
        description: 'Max images to save (0 = unlimited)'
        required: false
        default: '0'
      extra_args:
        description: 'Extra args passed to the crawler'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          python -m storyset run -d sqlite.db --max-pages ${MAX_PAGES:-0} --limit ${LIMIT:-0} ${{ github.event.inputs.extra_args }}

      - name: Run export
        run: |
          python -m storyset export -d sqlite.db --out-json data/images.json --out-html data/index.html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: data

      - name: Commit generated data and DB
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [ ! -f data/images.json ]; then
            echo "No generated files to commit"
            exit 0
          fi
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add -f data/images.json data/index.html data/images.csv sqlite.db || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): 更新爬取結果（run #${{ github.run_number }})"
            git pull --rebase --autostash
            git push
          fi

  deploy-pages:
    needs: crawl
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
